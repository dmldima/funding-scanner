name: tests

on:
  push:
    paths: ['**.py', '.github/workflows/tests.yml']
  pull_request:
  workflow_dispatch: {}

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
