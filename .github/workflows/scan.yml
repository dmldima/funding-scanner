name: scan

on:
  # GitHub's scheduler is best-effort, not a cron: runs queue behind everyone
  # else's and are dropped outright under load. Measured on this repo, '*/30'
  # produced 2 runs in 8 hours instead of 16, with a 256-minute gap.
  #
  # Two mitigations, neither of which is a fix. Odd minutes avoid the stampede
  # at :00 and :30, when every default schedule on the platform fires at once.
  # Four entries instead of one give four chances per hour to land two runs;
  # the concurrency group below makes the surplus harmless, since a trigger
  # arriving while a scan is running simply queues.
  #
  # If regular sampling actually matters — and for measuring how long a spread
  # survives, it is the whole point — run scan.py from cron on a small VPS
  # instead. See README.
  schedule:
    - cron: '3 * * * *'
    - cron: '18 * * * *'
    - cron: '33 * * * *'
    - cron: '48 * * * *'
  workflow_dispatch: {}

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run scan
        run: python3 scan.py

      # always(): scan.py exits 1 when every venue was blocked, and that run is
      # precisely the one whose venue_status.csv record matters most. Without
      # this the step is skipped on failure and the evidence dies with the runner.
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "scan: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
